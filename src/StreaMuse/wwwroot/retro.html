<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About StreaMuse</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #c0c0c0;
      color: #000;
      font: 11px Tahoma, "MS Sans Serif", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    body { display: flex; flex-direction: column; }

    .titlebar {
      flex: none;
      height: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 3px;
      background: linear-gradient(90deg, #0a246a, #a6caf0);
      color: #fff;
      font-weight: bold;
      font-size: 11px;
    }

    .titlebar-icon { font-size: 12px; line-height: 1; }
    .titlebar-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .titlebar-x {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border: 1px outset #dfdfdf;
      color: #000;
      font: bold 10px Tahoma, sans-serif;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
      padding: 0;
    }
    .titlebar-x:active { border-style: inset; }

    .sheet { flex: 1; min-height: 0; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

    .row { display: flex; gap: 10px; }

    .badge {
      flex: none;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: #fff;
      border: 2px inset #dfdfdf;
    }

    .blurb { flex: 1; line-height: 1.5; }
    .blurb b { font-size: 13px; }

    .panel {
      flex: none;
      padding: 6px 8px;
      background: #fff;
      border: 2px inset #dfdfdf;
      font-family: "Courier New", monospace;
      white-space: pre;
      line-height: 1.4;
    }

    .scope {
      flex: 1;
      min-height: 60px;
      position: relative;
      background: #000;
      border: 2px inset #dfdfdf;
      overflow: hidden;
    }

    .bouncer {
      position: absolute;
      padding: 3px 6px;
      font-weight: bold;
      font-size: 11px;
      color: #0f0;
      white-space: nowrap;
    }

    .buttons { flex: none; display: flex; justify-content: flex-end; }

    .btn95 {
      min-width: 75px;
      height: 23px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      font: 11px Tahoma, "MS Sans Serif", sans-serif;
      cursor: default;
    }
    .btn95:active { border-style: inset; }
  </style>
</head>

<body>

  <div class="titlebar" id="titlebar">
    <span class="titlebar-icon">♫</span>
    <span class="titlebar-title">About StreaMuse</span>
    <button class="titlebar-x" id="tb-close">✕</button>
  </div>

  <div class="sheet">
    <div class="row">
      <div class="badge">♫</div>
      <div class="blurb">
        <b>StreaMuse 95</b><br>
        Version 4.00.950<br>
        Copyright &copy; 1995-2026 EngineeringCat.<br>
        All rights reserved. Some rights left lying around.
      </div>
    </div>

    <div class="panel" id="specs">Processor:      Beat-Detector(TM) 486DX
Memory:         640K (ought to be enough)
Free disk:      1.44 MB
Now mixing:     nothing, as usual</div>

    <div class="scope" id="scope">
      <div class="bouncer" id="bouncer">♫ StreaMuse</div>
    </div>

    <div class="buttons">
      <button class="btn95" id="btn-ok">OK</button>
    </div>
  </div>

  <script>
    'use strict';

    function toHost(command) {
      window.chrome?.webview?.postMessage({ command });
    }

    document.getElementById('tb-close').onclick = () => toHost('close');
    document.getElementById('btn-ok').onclick = () => toHost('close');

    document.getElementById('titlebar').addEventListener('mousedown', event => {
      if (event.button !== 0 || event.target.closest('.titlebar-x')) return;
      toHost('drag');
    });

    // A DVD-logo bounce for the "screen saver preview" feel - the whole point of a Win95 About box
    // is that it looks like it is doing something even though it is not.
    const colors = ['#0f0', '#0ff', '#ff0', '#f0f', '#f80', '#fff'];
    let colorIndex = 0;

    const scope = document.getElementById('scope');
    const bouncer = document.getElementById('bouncer');
    let x = 20, y = 20, dx = 1.3, dy = 1.1;

    function tick() {
      const maxX = scope.clientWidth - bouncer.offsetWidth;
      const maxY = scope.clientHeight - bouncer.offsetHeight;

      x += dx;
      y += dy;

      if (x <= 0 || x >= maxX) { dx = -dx; x = Math.max(0, Math.min(x, maxX)); bounce(); }
      if (y <= 0 || y >= maxY) { dy = -dy; y = Math.max(0, Math.min(y, maxY)); bounce(); }

      bouncer.style.transform = `translate(${x}px, ${y}px)`;
      requestAnimationFrame(tick);
    }

    function bounce() {
      colorIndex = (colorIndex + 1) % colors.length;
      bouncer.style.color = colors[colorIndex];
    }

    requestAnimationFrame(tick);
  </script>

</body>

</html>
