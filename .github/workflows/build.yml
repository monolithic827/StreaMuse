name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Stage ffmpeg and cloudflared
        run: |
          # go-librespot is not staged: the app downloads it, from the tag the go-librespot workflow
          # publishes. deps.py holds the URLs so a source run and a release build fetch the same
          # builds.
          New-Item -ItemType Directory -Force -Path vendor/bin > $null
          $urls = uv run python -c "from streamuse.deps import FFMPEG_URL, CLOUDFLARED_URL; print(FFMPEG_URL); print(CLOUDFLARED_URL)"

          curl.exe -fLo ffmpeg.zip $urls[0]
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          # The archive nests everything under ffmpeg-master-latest-win64-gpl/bin/.
          Copy-Item @(Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe)[0].FullName vendor/bin/

          curl.exe -fLo vendor/bin/cloudflared.exe $urls[1]

      - name: Check what will be shipped
        run: |
          $missing = @('ffmpeg.exe', 'cloudflared.exe') | Where-Object { -not (Test-Path "vendor/bin/$_") }
          if ($missing) { throw "not staged: $missing" }
          Get-ChildItem vendor/bin | Format-Table Name, Length

      - name: Build
        run: uv run pyinstaller streamuse.spec --noconfirm

      - uses: actions/upload-artifact@v7
        with:
          name: StreaMuse-win-x64
          path: dist/StreaMuse.exe

      - name: Release
        # A version tag publishes a proper versioned release. Every other push to main replaces a
        # rolling "latest" release instead, so what a new user downloads is the newest working build
        # rather than whatever was last tagged by hand - the README sends them straight to it.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            gh release create $env:GITHUB_REF_NAME dist/StreaMuse.exe --generate-notes
          } else {
            # Asked rather than attempted-and-ignored: this shell stops the step on any non-zero
            # exit, so a delete of a release that is not there yet would fail the first run.
            $tags = (gh release list --limit 100 --json tagName | ConvertFrom-Json).tagName
            if ($tags -contains 'latest') { gh release delete latest --yes --cleanup-tag }

            gh release create latest dist/StreaMuse.exe `
              --title "StreaMuse (latest build)" `
              --notes "Automatic build of the newest main branch commit ($env:GITHUB_SHA)." `
              --target $env:GITHUB_SHA `
              --latest
          }
