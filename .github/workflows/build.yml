name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Stage ffmpeg and cloudflared
        run: |
          # go-librespot is not staged: the app downloads it, from the tag the go-librespot workflow
          # publishes. deps.py holds the URLs so a source run and a release build fetch the same
          # builds.
          New-Item -ItemType Directory -Force -Path vendor/bin > $null
          $urls = uv run python -c "from streamuse.deps import FFMPEG_URL, CLOUDFLARED_URL; print(FFMPEG_URL); print(CLOUDFLARED_URL)"

          curl.exe -fLo ffmpeg.zip $urls[0]
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          # The archive nests everything under ffmpeg-master-latest-win64-gpl/bin/.
          Copy-Item @(Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe)[0].FullName vendor/bin/

          curl.exe -fLo vendor/bin/cloudflared.exe $urls[1]

      - name: Check what will be shipped
        run: |
          $missing = @('ffmpeg.exe', 'cloudflared.exe') | Where-Object { -not (Test-Path "vendor/bin/$_") }
          if ($missing) { throw "not staged: $missing" }
          Get-ChildItem vendor/bin | Format-Table Name, Length

      - name: Build
        run: uv run pyinstaller streamuse.spec --noconfirm

      - uses: actions/upload-artifact@v7
        with:
          name: StreaMuse-win-x64
          path: dist/StreaMuse.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/StreaMuse.exe --generate-notes
