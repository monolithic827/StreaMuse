name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Set here rather than in the csproj so local runs stay framework-dependent.
      - name: Publish
        run: >
          dotnet publish src/StreaMuse/StreaMuse.csproj -c Release -o publish
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IsTransformWebConfigDisabled=true

      - name: Drop symbols and XML docs
        run: Get-ChildItem publish\*.pdb, publish\*.xml | Remove-Item

      - uses: actions/upload-artifact@v7
        with:
          name: StreaMuse-win-x64
          path: publish

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish\* -DestinationPath StreaMuse-win-x64.zip
          gh release create $env:GITHUB_REF_NAME StreaMuse-win-x64.zip --generate-notes
